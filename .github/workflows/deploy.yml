# GitHub Pages へのデプロイ用ワークフロー
name: Deploy to GitHub Pages

on:
  # main ブランチへの push 時にデプロイ
  push:
    branches: [main]
  # 手動実行も可能
  workflow_dispatch:

# GitHub Pages へのデプロイ権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行の制御
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ビルドジョブ
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          # GitHub Pages 用のベースパス（リポジトリ名に合わせて自動設定）
          VITE_BASE_URL: /${{ github.event.repository.name }}/

      # 配る成果物そのものをゲートに通す。
      # 別ジョブで再ビルドすると「試験した dist」と「配る dist」が別物になるため、
      # ここで同一の dist に対して実行する。失敗すれば artifact は上がらず deploy は起きない。
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Release gate against the artifact
        run: npm run test:e2e:gate
        env:
          # Pages 用 base でビルドしているため、preview も同じサブパスで配信される
          E2E_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Upload release gate report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-release-gate-report
          path: playwright-report/
          retention-days: 7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  # デプロイジョブ
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
