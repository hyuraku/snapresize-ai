<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    maskable アイコン用のソース。favicon.svg との違いは2点:
      1. 背景を角丸ではなく全面に塗る（OS が任意の形に切り抜くため）
      2. 中身を 70% に縮めて中央に寄せ、safe zone（中央 80% の円）に収める
    favicon.svg を変更したら、こちらも合わせて更新すること。
  -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b5b"/>
      <stop offset="100%" style="stop-color:#e85a4a"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" fill="url(#grad)"/>
  <g transform="translate(16 16) scale(0.7) translate(-17 -17)">
    <!-- Image frame -->
    <rect x="7" y="9" width="12" height="12" rx="2" fill="none" stroke="white" stroke-width="1.5"/>
    <!-- Mountain/image icon -->
    <path d="M9 18 L11 15 L14 18 L17 13" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Sun circle -->
    <circle cx="17" cy="12" r="1.5" fill="white"/>
    <!-- Plus sign -->
    <line x1="23" y1="17" x2="23" y2="25" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="19" y1="21" x2="27" y2="21" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
